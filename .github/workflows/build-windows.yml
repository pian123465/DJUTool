name: Build Windows .exe

on:
  workflow_dispatch:  # 只在手动触发时运行

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          keys: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: 构建 .exe(PyInstaller)
        run: pyinstaller shortdrama.spec --clean --noconfirm

      - name: 验证产物
        run: |
          dir dist\shortdrama-dl.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: shortdrama-dl-windows
          path: dist\shortdrama-dl.exe
          if-no-files-found: error
